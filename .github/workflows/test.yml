name: Backend Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: student_tracking_user
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: student_tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://student_tracking_user:testpass@localhost:5432/student_tracking_test
      JWT_SECRET_KEY: ci-test-secret-key-that-is-long-enough-for-the-validator-check

    defaults:
      run:
        working-directory: student_tracking_app/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            student_tracking_app/backend/requirements.txt
            student_tracking_app/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --tb=short
